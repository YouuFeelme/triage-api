# Runs on every pull request and every push to main.
# A PR can only be trusted if this is green: same checks you run locally, on a clean machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL next to the job, like docker-compose does on your Mac.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` installs exactly what package-lock.json says, and fails if it's out of sync.
      - run: npm ci

      - name: Typecheck, ESLint, Prettier, OpenAPI contract
        run: npm run check

      - name: Tests with coverage (fails under 80%)
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://triage:triage@localhost:5432/triage_test

      - name: Compile for production
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Builds the production image to prove the Dockerfile works. Nothing is pushed yet (phase 8).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: triage-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
